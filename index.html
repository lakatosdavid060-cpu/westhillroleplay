<!DOCTYPE html>

<style>
:root{
--primary:#8b5cf6;--secondary:#6d28d9;--dark:#0a0c12;--dark-card:#141820;
--text:#fff;--text-muted:#a1a1aa;--nav-height:80px;--discord:#5865F2;
--tiktok:#ff0050;--youtube:#ff0000;--instagram:#e1306c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--text);overflow-x:hidden;font-family:'Poppins',sans-serif}
body.light{--dark:#f4f4f8;--dark-card:#fff;--text:#111;--text-muted:#555}
body.loading{overflow:hidden}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:20px}

/* LOADER */
#loader{
position:fixed;inset:0;background:var(--dark);z-index:9999;
display:flex;flex-direction:column;align-items:center;justify-content:center;
transition:opacity .6s,visibility .6s;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo{
font-family:'Orbitron',sans-serif;font-size:clamp(32px,6vw,56px);font-weight:800;
background:linear-gradient(90deg,#fff,var(--primary));-webkit-background-clip:text;color:transparent;
animation:loaderPulse 1.5s ease-in-out infinite;
}
.loader-bar{width:200px;height:3px;background:rgba(255,255,255,.1);border-radius:10px;margin-top:24px;overflow:hidden}
.loader-bar span{display:block;height:100%;background:var(--primary);animation:loaderBar 1.2s ease-in-out infinite}
@keyframes loaderPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes loaderBar{0%{width:0;margin-left:0}50%{width:100%;margin-left:0}100%{width:0;margin-left:100%}}

/* BG */
.bg-wrap{position:fixed;inset:0;z-index:-2;overflow:hidden}
.bg-gradient{
position:absolute;inset:0;
background:radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.18),transparent 50%),
radial-gradient(ellipse at 80% 80%,rgba(109,40,217,.12),transparent 50%),var(--dark);
animation:bgShift 12s ease-in-out infinite alternate;
}
@keyframes bgShift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(15deg)}}
.particles{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20px 30px,rgba(255,255,255,.15),transparent),
radial-gradient(1px 1px at 40px 70px,rgba(139,92,246,.2),transparent),
radial-gradient(1px 1px at 90px 40px,rgba(255,255,255,.1),transparent);
background-size:200px 200px;animation:particleDrift 60s linear infinite}
@keyframes particleDrift{0%{transform:translateY(0)}100%{transform:translateY(-200px)}}

/* NAVBAR */
.navbar{
position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;
padding:18px 6%;background:rgba(10,12,18,.85);backdrop-filter:blur(15px);z-index:999;
border-bottom:1px solid rgba(255,255,255,.05);transition:background .3s,box-shadow .3s;
}
.navbar.scrolled{background:rgba(10,12,18,.97);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.logo{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:800;color:#fff;text-decoration:none}
.logo span{color:var(--primary)}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-toggle{display:none;background:none;border:1px solid rgba(255,255,255,.15);color:#fff;font-size:22px;width:44px;height:44px;border-radius:12px;cursor:pointer}
.nav-links{display:flex;gap:6px;flex-wrap:wrap}
.nav-links a{color:#fff;text-decoration:none;padding:9px 14px;border-radius:12px;transition:.3s;font-size:13px}
.nav-links a:hover,.nav-links a.active{background:rgba(139,92,246,.15)}
.lang-btn,.theme-btn{
background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;
padding:8px 12px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;transition:.3s;
}
.lang-btn:hover,.theme-btn:hover{background:rgba(139,92,246,.2)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* HERO */
.hero{
min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;
padding:calc(var(--nav-height) + 30px) 20px 50px;position:relative;
}
.hero-glow{position:absolute;width:500px;height:500px;background:var(--primary);filter:blur(180px);opacity:.12;border-radius:50%;animation:glowPulse 4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.18;transform:scale(1.1)}}
.hero-content{position:relative;z-index:2}
.hero h1{
font-family:'Orbitron',sans-serif;font-size:clamp(38px,8vw,76px);font-weight:800;margin-bottom:15px;
background:linear-gradient(135deg,#fff 40%,var(--primary));-webkit-background-clip:text;color:transparent;
}
.hero p{font-size:clamp(15px,2.5vw,19px);color:var(--text-muted);max-width:680px;margin:0 auto 32px;line-height:1.7}
.hero-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.ip-box{
display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:12px 18px;border-radius:16px;
}
.ip-label{font-size:13px;color:var(--text-muted)}
.ip-value{font-weight:700;color:var(--primary);letter-spacing:.5px;font-family:'Orbitron',sans-serif;font-size:14px}
.ip-box button{background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.4);color:#fff;padding:7px 13px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;transition:.3s}
.ip-box button:hover{background:rgba(139,92,246,.35)}

/* BUTTONS */
.btn{display:inline-block;padding:14px 28px;border:none;border-radius:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:.3s;font-size:14px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 0 30px rgba(139,92,246,.5)}
.btn-secondary{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.btn-discord{background:var(--discord);color:#fff}
.btn-discord:hover{transform:translateY(-3px);box-shadow:0 0 30px rgba(88,101,242,.5)}
.btn-connect{background:#22c55e;color:#fff}
.btn-connect:hover{transform:translateY(-3px);box-shadow:0 0 30px rgba(34,197,94,.4)}
.btn-tiktok{background:var(--tiktok);color:#fff}
.btn-tiktok:hover{transform:translateY(-3px);box-shadow:0 0 25px rgba(255,0,80,.4)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-sm{padding:8px 16px;font-size:12px}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:#22c55e;color:#fff}
.btn-success:hover{background:#16a34a}

/* SECTIONS */
.section{padding:110px 6%;scroll-margin-top:var(--nav-height)}
.section-title{text-align:center;font-family:'Orbitron',sans-serif;font-size:clamp(28px,5vw,40px);margin-bottom:50px}
.section-title span{color:var(--primary)}
.search-box{max-width:500px;margin:0 auto 40px;position:relative}
.search-box input{
width:100%;padding:14px 20px 14px 44px;background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);border-radius:14px;color:#fff;font-size:15px;
}
.search-box::before{content:'🔍';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;max-width:900px;margin:0 auto}
.stat-card{text-align:center;padding:32px 16px}
.stat-number{font-family:'Orbitron',sans-serif;font-size:44px;font-weight:800;color:var(--primary);margin-bottom:6px}
.stat-label{color:var(--text-muted);font-size:14px}
.stat-card.live .stat-number{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.card{
background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);padding:28px;
border-radius:22px;backdrop-filter:blur(16px);transition:.35s;opacity:0;transform:translateY(40px);
}
.card.visible{opacity:1;transform:translateY(0)}
.card:hover{transform:translateY(-6px);border-color:rgba(139,92,246,.45)}
.card.visible:hover{transform:translateY(-6px)}
.card h3{margin-bottom:12px;color:var(--primary);font-size:17px}
.card p{color:var(--text-muted);line-height:1.7;font-size:14px}
.card.hidden-rule{display:none}
.faction-badge{display:inline-block;padding:7px 14px;background:rgba(139,92,246,.15);border-radius:999px;margin-bottom:12px;font-size:12px}

/* NEWS */
.news-date{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:8px}
.news-title{font-size:18px;font-weight:700;margin-bottom:10px;color:#fff}

/* GALLERY */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gallery-item{
border-radius:16px;overflow:hidden;aspect-ratio:16/10;position:relative;cursor:pointer;
border:1px solid rgba(255,255,255,.06);opacity:0;transform:scale(.95);transition:.4s;
background:rgba(139,92,246,.1);display:flex;align-items:center;justify-content:center;
}
.gallery-item.visible{opacity:1;transform:scale(1)}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gallery-item:hover img{transform:scale(1.08)}
.gallery-item::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.6));pointer-events:none}
.gallery-placeholder{font-size:48px;text-align:center;color:rgba(255,255,255,.3)}

/* FORM */
.form-container{max-width:800px;margin:auto}
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:7px;font-weight:500;font-size:14px}
.form-group input,.form-group textarea,.form-group select{
width:100%;padding:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
border-radius:12px;color:#fff;font-family:inherit;font-size:14px;
}
.form-group input::placeholder,.form-group textarea::placeholder{color:#6b7280}
.form-group select option{background:#141820}
.form-group textarea{resize:vertical;min-height:160px}
.form-extra{display:none}
.form-extra.show{display:block}
.form-message{display:none;margin-top:18px;padding:14px 18px;border-radius:12px;font-size:14px;line-height:1.6}
.form-message.success{display:block;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#86efac}
.form-message.error{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5}

/* ADMIN TEAM */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.admin-card{text-align:center}
.admin-avatar{
width:100px;height:100px;border-radius:50%;margin:0 auto 14px;
background:linear-gradient(45deg,var(--primary),var(--secondary));
display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;
overflow:hidden;position:relative;border:3px solid rgba(139,92,246,.3);
}
.admin-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.admin-avatar .avatar-fallback{display:flex}
.admin-avatar img:not([src=""])+.avatar-fallback{display:none}
.rank{color:var(--primary);font-weight:600;margin-bottom:6px;font-size:13px}
.admin-discord{font-size:12px;color:var(--text-muted);margin-top:5px}

/* DISCORD */
.discord-section{display:flex;justify-content:center;align-items:flex-start;gap:36px;flex-wrap:wrap}
.discord-info{max-width:380px}
.discord-info p{color:var(--text-muted);line-height:1.8;margin-bottom:18px;font-size:14px}
.discord-widget{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.discord-widget iframe{display:block;max-width:100%}

/* FOOTER */
footer{padding:50px 6% 30px;border-top:1px solid rgba(255,255,255,.05);color:var(--text-muted);text-align:center}
footer h3{font-family:'Orbitron',sans-serif;margin-bottom:8px;color:#fff}
.social-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.social-links a{
width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
text-decoration:none;font-size:20px;transition:.3s;border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.04);color:#fff;
}
.social-links a:hover{transform:translateY(-4px)}
.social-links a.discord:hover{background:var(--discord);border-color:var(--discord)}
.social-links a.tiktok:hover{background:var(--tiktok);border-color:var(--tiktok)}
.social-links a.youtube:hover{background:var(--youtube);border-color:var(--youtube)}
.social-links a.instagram:hover{background:var(--instagram);border-color:var(--instagram)}
.footer-copy{font-size:13px;margin-top:20px;opacity:.6}

/* BACK TO TOP */
#backTop{
position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:14px;
background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:20px;
opacity:0;visibility:hidden;transition:.3s;z-index:900;box-shadow:0 4px 20px rgba(139,92,246,.4);
}
#backTop.show{opacity:1;visibility:visible}
#backTop:hover{transform:translateY(-4px)}

/* ADMIN PANEL */
#adminFab{
position:fixed;bottom:24px;left:24px;width:44px;height:44px;border-radius:12px;
background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text-muted);
cursor:pointer;font-size:16px;z-index:900;transition:.3s;
}
#adminFab:hover{background:rgba(139,92,246,.2);color:#fff}
.admin-overlay{
position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;display:none;
align-items:center;justify-content:center;padding:20px;overflow-y:auto;
}
.admin-overlay.open{display:flex}
.admin-modal{
background:var(--dark-card);border:1px solid rgba(255,255,255,.1);border-radius:20px;
padding:30px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;margin:auto;
}
.admin-modal h3{font-family:'Orbitron',sans-serif;margin-bottom:20px;color:var(--primary)}
.admin-modal label{display:block;margin:12px 0 5px;font-size:13px}
.admin-modal input,.admin-modal textarea{
width:100%;padding:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
border-radius:10px;color:#fff;font-size:13px;
}
.admin-modal textarea{min-height:80px;resize:vertical}
.admin-modal .btn-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.admin-modal .btn{padding:10px 18px;font-size:13px}
.admin-tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
.admin-tabs button{background:none;border:none;color:var(--text-muted);padding:10px 15px;cursor:pointer;border-bottom:2px solid transparent;transition:.3s}
.admin-tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.admin-section{display:none}
.admin-section.active{display:block}
.admin-list{max-height:300px;overflow-y:auto;margin:15px 0;padding:10px;background:rgba(255,255,255,.02);border-radius:10px}
.admin-item{
display:flex;justify-content:space-between;align-items:center;padding:10px;background:rgba(255,255,255,.05);
margin-bottom:8px;border-radius:8px;font-size:13px;
}
.admin-item button{padding:4px 8px;font-size:11px}

/* LIGHTBOX */
#lightbox{
position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10001;display:none;
align-items:center;justify-content:center;padding:20px;
}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:85vh;border-radius:12px}
#lightbox .close{
position:absolute;top:20px;right:24px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
:root{--nav-height:120px}
.navbar{padding:14px 4%;flex-wrap:wrap}
.nav-right{width:100%;justify-content:flex-end;order:3}
.nav-toggle{display:block}
.nav-links{display:none;width:100%;flex-direction:column;gap:6px;padding-top:8px}
.nav-links.open{display:flex}
.nav-links a{text-align:center}
.discord-widget iframe{width:100%!important;height:380px!important}
#adminFab,#backTop{bottom:16px}
#adminFab{left:16px}
#backTop{right:16px}
.admin-modal{max-width:90vw;padding:20px}
}
</style>
</head>
